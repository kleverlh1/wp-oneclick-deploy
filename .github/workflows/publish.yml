name: Publicar a S3

on:
  push:
    branches: [main]
    paths:
      - 'cloudformation/**'
      - 'scripts/bootstrap.sh'
      - 'scripts/publish.sh'
      - '.github/workflows/publish.yml'
    tags: ['v*']
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Diagnostico OIDC
        run: |
          TOKEN=$(curl -sS \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r .value)
          P=$(echo "$TOKEN" | cut -d. -f2)
          P="$P$(printf '=%.0s' $(seq $(( (4 - ${#P} % 4) % 4 ))))"
          echo "===== CLAIMS QUE ENVIA GITHUB ====="
          echo "$P" | base64 -d | jq '{iss, aud, sub, repository, ref}'
          echo "==================================="

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::968638548210:role/wp-oneclick-publisher
          aws-region: us-east-1

      - name: Publicar
        run: bash scripts/publish.sh
