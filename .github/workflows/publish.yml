name: Publicar a S3

on:
  push:
    branches: [main]
    paths:
      - 'cloudformation/**'
      - 'scripts/bootstrap.sh'
      - 'scripts/publish.sh'
      - '.github/workflows/publish.yml'
    tags: ['v*']
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::968638548210:role/wp-oneclick-publisher
          aws-region: us-east-1

      - name: Publicar
        run: bash scripts/publish.sh
